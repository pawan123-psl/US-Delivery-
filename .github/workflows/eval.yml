name: Eval Harness CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  eval:
    name: Run evaluation harness
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies (requirements.txt is at repo root) ─────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Smoke-test: verify all imports load cleanly ─────────────────────
      - name: Smoke-test imports
        run: |
          python -c "
          import config, models, kb_index, prompts
          import triage, account_brief, api, eval_harness
          from models import TicketInput, TriageOutput, AccountBrief, RiskItem
          print('ALL IMPORTS OK')
          print('Task 1 test cases:', len(eval_harness.TASK1_TEST_CASES))
          print('Task 2 test cases:', len(eval_harness.TASK2_TEST_CASES))
          "

      # ── 5. Run eval harness ───────────────────────────────────────────────
      - name: Debug secret presence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "WARNING: GROQ_API_KEY is empty or not set"
          else
            echo "GROQ_API_KEY is set (length: ${#GROQ_API_KEY})"
          fi

      - name: Run evaluation harness
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          DATA_DIR: ./data
        run: python eval_harness.py --no-llm-judge || true

      # ── 6. Upload eval reports ─────────────────────────────────────────────
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            eval_report.json
            eval_report.md
          if-no-files-found: warn
