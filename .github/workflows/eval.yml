name: Eval Harness CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  eval:
    name: Run evaluation harness
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ─────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            Task-1/requirements.txt
            Task-3/requirements.txt

      # ── Install Task-1 deps ────────────────────────────────────────────────
      - name: Install Task-1 dependencies
        working-directory: Task-1
        run: pip install -r requirements.txt

      # ── Install Task-3 deps ────────────────────────────────────────────────
      - name: Install Task-3 dependencies
        working-directory: Task-3
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── Smoke-test imports ─────────────────────────────────────────────────
      - name: Verify Task-1 imports
        working-directory: Task-1
        run: python -c "import config, models, kb_index, prompts, triage, api; print('All Task-1 imports OK')"

      # ── Run eval harness ───────────────────────────────────────────────────
      - name: Run evaluation harness
        working-directory: Task-3
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATA_DIR: "../Task/resources/starter-repo"
        run: |
          if [ -f run_eval.py ]; then
            python run_eval.py --output eval_report.json
          else
            echo "Eval harness not yet implemented — skipping"
          fi

      # ── Upload eval report as artifact ─────────────────────────────────────
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: Task-3/eval_report.json
          if-no-files-found: ignore
